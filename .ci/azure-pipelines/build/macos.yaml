steps:
  - checkout: self
    # find the commit hash on a quick non-forced update too
    fetchDepth: 10
  - script: |
      brew install cmake
      brew install pkg-config boost eigen flann nanoflann glew libusb qhull vtk glew freeglut qt libpcap libomp suite-sparse zlib google-benchmark cjson googletest
      brew install brewsci/science/openni
    displayName: 'Install Dependencies'
  - script: |
      mkdir $BUILD_DIR && cd $BUILD_DIR
      cmake $(Build.SourcesDirectory) \
        -DCMAKE_BUILD_TYPE="MinSizeRel" \
        -DCMAKE_OSX_SYSROOT="/Library/Developer/CommandLineTools/SDKs/MacOSX$(OSX_VERSION).sdk" \
        -DCMAKE_CXX_FLAGS="$CMAKE_CXX_FLAGS" \
        -DPCL_ONLY_CORE_POINT_TYPES=ON \
        -DBUILD_surface_on_nurbs=ON -DUSE_UMFPACK=ON \
        -DBUILD_simulation=ON \
        -DBUILD_global_tests=ON \
        -DBUILD_benchmarks=ON \
        -DBUILD_examples=ON \
        -DBUILD_tools=ON \
        -DBUILD_apps=ON \
        -DBUILD_apps_3d_rec_framework=ON \
        -DBUILD_apps_cloud_composer=ON \
        -DBUILD_apps_in_hand_scanner=ON \
        -DBUILD_apps_modeler=ON \
        -DBUILD_apps_point_cloud_editor=ON \
        -DBoost_USE_DEBUG_RUNTIME=OFF
    displayName: 'CMake Configuration'
  - script: |
      cd $BUILD_DIR
      cmake --build . -- -j2
    displayName: 'Build Library'
  - script: cd $BUILD_DIR && cmake --build . -- tests
    displayName: 'Run Unit Tests'
  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'CTest'
      testResultsFiles: '**/Test*.xml'
      searchFolder: '$(Agent.WorkFolder)/build'
    condition: succeededOrFailed()

